<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftLog — Exercise Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
  import { initializeApp }                              from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, setDoc,
           deleteDoc, onSnapshot, query, orderBy }      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut,
           createUserWithEmailAndPassword,
           signInWithEmailAndPassword,
           GoogleAuthProvider, signInWithPopup,
           sendPasswordResetEmail }                     from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ─────────────────────────────────────────────────────────────────────────
  // 🔧 PASTE YOUR FIREBASE CONFIG OBJECT HERE
  // ─────────────────────────────────────────────────────────────────────────
  const firebaseConfig = {
  apiKey: "AIzaSyCQMNCRENtWsZ_ulSeWheErkghbkh4O09g",
  authDomain: "liftlog-45dad.firebaseapp.com",
  projectId: "liftlog-45dad",
  storageBucket: "liftlog-45dad.firebasestorage.app",
  messagingSenderId: "792245724759",
  appId: "1:792245724759:web:bbc7dde44103b09056e512",
  measurementId: "G-K504665W17"
};
  // ─────────────────────────────────────────────────────────────────────────

  const app      = initializeApp(firebaseConfig);
  const db       = getFirestore(app);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();

  let unsubCards = null;

  // ── Auth state ────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, user => {
    if (user) {
      showApp(user);
    } else {
      showAuth();
    }
  });

  function showAuth() {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display  = 'none';
    if (unsubCards) { unsubCards(); unsubCards = null; }
    window._cards = [];
  }

  function showApp(user) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display  = 'block';
    document.getElementById('user-email').textContent    = user.displayName || user.email;
    document.getElementById('user-avatar').textContent   = (user.displayName || user.email)[0].toUpperCase();
    startListening(user.uid);
  }

  function startListening(uid) {
    if (unsubCards) unsubCards();
    const q = query(collection(db, 'users', uid, 'exercises'), orderBy('createdAt'));
    unsubCards = onSnapshot(q, snap => {
      const incoming = [];
      snap.forEach(d => incoming.push({ id: d.id, ...d.data() }));
      if (incoming.length === 0) {
        const defaults = [
          { id: gid(), name: 'Push-Ups', unit: 'reps',  icon: '💪', entries: [], color: '#e8ff47', createdAt: Date.now() },
          { id: gid(), name: 'Running',  unit: 'miles', icon: '🏃', entries: [], color: '#47b4ff', createdAt: Date.now()+1 },
        ];
        defaults.forEach(c => saveCard(uid, c));
        return;
      }
      window._cards = incoming;
      renderAll();
    }, err => { console.error(err); showToast('Firebase error — check console', 'error'); });
  }

  // ── Firestore helpers ─────────────────────────────────────────────────────
  function saveCard(uid, card) {
    const { id, ...data } = card;
    return setDoc(doc(db, 'users', uid, 'exercises', id), data);
  }

  function removeCard(uid, id) {
    return deleteDoc(doc(db, 'users', uid, 'exercises', id));
  }

  // expose to global scope with current user baked in
  window._saveCard   = (card) => saveCard(auth.currentUser.uid, card);
  window._removeCard = (id)   => removeCard(auth.currentUser.uid, id);
  window._fbReady    = true;

  // ── Auth actions ──────────────────────────────────────────────────────────
  window.doSignUp = async () => {
    const email = document.getElementById('auth-email').value.trim();
    const pass  = document.getElementById('auth-pass').value;
    if (!email || !pass) return setAuthError('Please enter email and password.');
    try {
      clearAuthError();
      await createUserWithEmailAndPassword(auth, email, pass);
    } catch(e) { setAuthError(friendlyError(e.code)); }
  };

  window.doSignIn = async () => {
    const email = document.getElementById('auth-email').value.trim();
    const pass  = document.getElementById('auth-pass').value;
    if (!email || !pass) return setAuthError('Please enter email and password.');
    try {
      clearAuthError();
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) { setAuthError(friendlyError(e.code)); }
  };

  window.doGoogle = async () => {
    try {
      clearAuthError();
      await signInWithPopup(auth, provider);
    } catch(e) { if (e.code !== 'auth/popup-closed-by-user') setAuthError(friendlyError(e.code)); }
  };

  window.doSignOut = async () => {
    Object.keys(chartInst).forEach(id => { chartInst[id].destroy(); delete chartInst[id]; });
    await signOut(auth);
  };

  window.doReset = async () => {
    const email = document.getElementById('auth-email').value.trim();
    if (!email) return setAuthError('Enter your email above first.');
    try {
      await sendPasswordResetEmail(auth, email);
      setAuthError('Password reset email sent! Check your inbox.', true);
    } catch(e) { setAuthError(friendlyError(e.code)); }
  };

  function setAuthError(msg, ok=false) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.color = ok ? 'var(--success)' : 'var(--danger)';
    el.style.display = 'block';
  }
  function clearAuthError() {
    const el = document.getElementById('auth-error');
    el.style.display = 'none';
  }

  function friendlyError(code) {
    const map = {
      'auth/email-already-in-use':    'That email is already registered. Try signing in.',
      'auth/invalid-email':           'Please enter a valid email address.',
      'auth/weak-password':           'Password must be at least 6 characters.',
      'auth/user-not-found':          'No account found with that email.',
      'auth/wrong-password':          'Incorrect password. Try again or reset it.',
      'auth/invalid-credential':      'Incorrect email or password.',
      'auth/too-many-requests':       'Too many attempts. Please wait a moment.',
      'auth/network-request-failed':  'Network error. Check your connection.',
      'auth/invalid-api-key':         'Firebase API key is invalid — check your config.',
      'auth/configuration-not-found':  'Firebase auth is not configured correctly.',
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  function gid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  window.togglePass = function() {
    const inp = document.getElementById('auth-pass');
    const icon = document.getElementById('eye-icon');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    icon.innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><circle cx="12" cy="12" r="3" opacity="0"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  };
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12;--surface:#12151e;--surface2:#181c28;--border:#252b3d;
  --accent:#e8ff47;--accent2:#47b4ff;--text:#dde1f0;--muted:#5c6380;
  --danger:#ff5252;--success:#47ffb4;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ── Auth Screen ─────────────────────────────────────────────────────────── */
#auth-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
  background:radial-gradient(ellipse at 60% 20%, rgba(232,255,71,.06) 0%, transparent 60%),
             radial-gradient(ellipse at 20% 80%, rgba(71,180,255,.05) 0%, transparent 50%),
             var(--bg);
}

.auth-box{
  width:100%;max-width:400px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px 32px 32px;
  display:flex;flex-direction:column;gap:20px;
}

.auth-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.4rem;letter-spacing:.14em;
  color:var(--accent);line-height:1;text-align:center;
}
.auth-logo span{color:var(--text)}
.auth-tagline{text-align:center;font-size:.83rem;color:var(--muted);margin-top:4px}

.auth-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.75rem}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}

.auth-fields{display:flex;flex-direction:column;gap:10px}
.pass-wrap{position:relative;display:flex;align-items:center}
.pass-wrap .auth-input{padding-right:42px}
.pass-toggle{position:absolute;right:11px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:color .15s}
.pass-toggle:hover{color:var(--accent2)}

.auth-input{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:11px 14px;border-radius:9px;
  font-family:'DM Sans',sans-serif;font-size:.9rem;
  outline:none;width:100%;transition:border-color .15s;
}
.auth-input:focus{border-color:var(--accent)}
.auth-input::placeholder{color:var(--muted)}

.auth-btn{
  width:100%;padding:11px;border:none;border-radius:9px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;
  cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;
  letter-spacing:.02em;
}
.auth-btn:active{transform:scale(.97)}
.auth-btn.primary{background:var(--accent);color:#0b0d12}
.auth-btn.primary:hover{box-shadow:0 4px 18px rgba(232,255,71,.25)}
.auth-btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.auth-btn.secondary:hover{border-color:var(--muted)}

.google-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:11px;border-radius:9px;
  background:#fff;color:#1f1f1f;border:none;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;
  cursor:pointer;transition:box-shadow .15s,transform .12s;
}
.google-btn:hover{box-shadow:0 2px 12px rgba(255,255,255,.15)}
.google-btn:active{transform:scale(.97)}
.google-btn svg{flex-shrink:0}

.auth-links{display:flex;justify-content:space-between;font-size:.78rem}
.auth-link{background:none;border:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.78rem;padding:0;transition:color .15s}
.auth-link:hover{color:var(--accent2)}

#auth-error{display:none;font-size:.8rem;text-align:center;padding:8px 12px;background:rgba(255,82,82,.08);border-radius:7px;border:1px solid rgba(255,82,82,.2)}

/* ── App Screen ──────────────────────────────────────────────────────────── */
#app-screen{display:none;padding-bottom:60px}

header{display:flex;align-items:center;justify-content:space-between;padding:18px 36px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,13,18,.94);backdrop-filter:blur(14px);z-index:100}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:.14em;color:var(--accent);line-height:1}
.logo span{color:var(--text)}
.hright{display:flex;align-items:center;gap:10px}

.user-pill{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:40px;padding:5px 12px 5px 6px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#0b0d12;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-email{font-size:.78rem;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.signout-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;transition:color .15s,border-color .15s}
.signout-btn:hover{color:var(--danger);border-color:var(--danger)}

.add-btn{display:flex;align-items:center;gap:7px;background:var(--accent);color:#0b0d12;border:none;padding:9px 17px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.86rem;cursor:pointer;border-radius:8px;transition:transform .15s,box-shadow .15s}
.add-btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(232,255,71,.22)}

/* Toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 20px;border-radius:40px;font-size:.83rem;font-weight:500;opacity:0;transition:transform .28s,opacity .28s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.error{border-color:var(--danger);color:var(--danger)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:24px;padding:28px 36px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;animation:up .28s ease;transition:box-shadow .2s}
.card:hover{box-shadow:0 8px 30px rgba(0,0,0,.28)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card-line{height:3px;width:100%}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 11px;border-bottom:1px solid var(--border);gap:9px}
.name-wrap{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.ex-icon{width:32px;height:32px;background:var(--surface2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;cursor:pointer;transition:background .15s;user-select:none}
.ex-icon:hover{background:var(--border)}
.ex-name{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.08em;color:var(--text);background:transparent;border:none;outline:none;width:100%;min-width:0}
.ex-name::placeholder{color:var(--muted)}
.card-btns{display:flex;gap:5px}
.icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.unit-row{display:flex;align-items:center;gap:9px;padding:9px 16px 0}
.unit-row label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.unit-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.82rem;width:110px;outline:none;transition:border-color .15s}
.unit-input:focus{border-color:var(--accent2)}
.stat-bar{display:flex;padding:9px 16px 11px;border-bottom:1px solid var(--border)}
.stat{display:flex;flex-direction:column;gap:2px;flex:1}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.05em;line-height:1}
.stat-lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sdiv{width:1px;background:var(--border);margin:0 10px}
.entry-form{display:flex;align-items:flex-end;gap:8px;padding:11px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:4px;flex:1}
.field label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.field input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.86rem;outline:none;width:100%;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.field input.error{border-color:var(--danger)!important}
.field input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.4);cursor:pointer}
.log-btn{background:var(--accent);color:#0b0d12;border:none;padding:7px 15px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.84rem;border-radius:7px;cursor:pointer;height:35px;white-space:nowrap;transition:background .15s,transform .1s;flex-shrink:0}
.log-btn:hover{background:#d4eb30}
.log-btn:active{transform:scale(.96)}
.chart-wrap{padding:13px 13px 9px;height:190px;max-height:190px;overflow:hidden;position:relative;flex-shrink:0}
.chart-wrap canvas{position:absolute;top:13px;left:13px;right:13px;bottom:9px;width:calc(100% - 26px)!important;height:calc(100% - 22px)!important}
.no-data{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:.8rem}
.no-data svg{opacity:.22}
.log-section{border-top:1px solid var(--border)}
.log-toggle{width:100%;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;padding:8px 16px;text-align:left;display:flex;align-items:center;gap:6px;transition:color .15s}
.log-toggle:hover{color:var(--text)}
.chev{transition:transform .2s}
.log-toggle.open .chev{transform:rotate(180deg)}
.log-table-wrap{display:none;padding:0 16px 11px;max-height:148px;overflow-y:auto}
.log-table-wrap.visible{display:block}
.log-table{width:100%;border-collapse:collapse;font-size:.79rem}
.log-table th{color:var(--muted);text-align:left;padding:3px 0;font-weight:500;border-bottom:1px solid var(--border)}
.log-table td{padding:4px 0;border-bottom:1px solid rgba(37,43,61,.5)}
.log-table td.del{text-align:right;color:var(--muted);cursor:pointer}
.log-table td.del:hover{color:var(--danger)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media(max-width:600px){
  header{padding:14px 16px}
  .grid{padding:18px 14px;gap:16px;grid-template-columns:1fr}
  .logo{font-size:1.6rem}
  .user-email{display:none}
  .auth-box{padding:28px 20px 24px}
}
</style>
</head>
<body>

<!-- ── Auth Screen ─────────────────────────────────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-box">
    <div>
      <div class="auth-logo">LIFT<span>LOG</span></div>
      <div class="auth-tagline">Track your workouts. Own your progress.</div>
    </div>

    <button class="google-btn" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or use email</div>

    <div class="auth-fields">
      <input class="auth-input" id="auth-email" type="email" placeholder="Email address" autocomplete="email">
      <div class="pass-wrap">
        <input class="auth-input" id="auth-pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doSignIn()">
        <button class="pass-toggle" type="button" onclick="togglePass()" title="Show/hide password" aria-label="Toggle password visibility">
          <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="auth-error"></div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="auth-btn primary" onclick="doSignIn()">Sign In</button>
      <button class="auth-btn secondary" onclick="doSignUp()">Create Account</button>
    </div>

    <div class="auth-links">
      <button class="auth-link" onclick="doReset()">Forgot password?</button>
    </div>
  </div>
</div>

<!-- ── App Screen ─────────────────────────────────────────────────────────── -->
<div id="app-screen">
  <header>
    <div class="logo">LIFT<span>LOG</span></div>
    <div class="hright">
      <div class="user-pill">
        <div class="user-avatar" id="user-avatar">?</div>
        <span class="user-email" id="user-email"></span>
      </div>
      <button class="signout-btn" onclick="doSignOut()">Sign Out</button>
      <button class="add-btn" onclick="addCard()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Add Exercise
      </button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>

<div id="toast"></div>

<script>
const PALETTE=['#e8ff47','#47b4ff','#ff8c47','#b047ff','#47ffb4','#ff4787','#ff47d4','#47ffd4'];
const ICONS  =['💪','🏃','🚴','🧘','⚽','🏊','🤸','🥊','🎽','🏋️','🧗','🤾'];
let colorIdx =0;

function gid()       { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today()     { return new Date().toISOString().split('T')[0]; }
function fmtD(d)     { if(!d)return''; const[y,m,day]=d.split('-'); return`${m}/${day}/${y.slice(2)}`; }
function nc()        { return PALETTE[colorIdx++%PALETTE.length]; }
function esc(s)      { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hexRgba(h,a){ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return`rgba(${r},${g},${b},${a})`; }
function card(id)    { return (window._cards||[]).find(c=>c.id===id); }

let _tt;
window.showToast = function(msg,type='') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(_tt); _tt=setTimeout(()=>t.className='',2800);
};

// ── Mutations ────────────────────────────────────────────────────────────────
function persist(c) {
  window._saveCard(c);
}

function addCard() {
  const c={id:gid(),name:'New Exercise',unit:'reps',icon:ICONS[Math.floor(Math.random()*ICONS.length)],color:nc(),entries:[],createdAt:Date.now()};
  window._saveCard(c);
  showToast('Exercise added ✓','success');
  setTimeout(()=>{ const el=document.querySelector(`#card-${c.id} .ex-name`); if(el){el.focus();el.select();} },120);
}

function deleteCard(id) {
  if(!confirm('Delete this exercise and all its data?')) return;
  window._removeCard(id);
  if(chartInst[id]){ chartInst[id].destroy(); delete chartInst[id]; }
  showToast('Exercise deleted','error');
}

function logEntry(id) {
  const c=card(id); if(!c) return;
  const dEl=document.getElementById(`date-${id}`);
  const aEl=document.getElementById(`amt-${id}`);
  const amt=parseFloat(aEl.value);
  if(!dEl.value||isNaN(amt)||amt<0){aEl.classList.add('error');setTimeout(()=>aEl.classList.remove('error'),800);return;}
  c.entries=[...(c.entries||[]),{id:gid(),date:dEl.value,amount:amt}];
  persist(c); aEl.value='';
  showToast(`Logged ${amt} ${c.unit} ✓`,'success');
}

function deleteEntry(cid,eid) {
  const c=card(cid); if(!c) return;
  c.entries=(c.entries||[]).filter(e=>e.id!==eid);
  persist(c);
}

function updateName(id,val) { const c=card(id); if(c){c.name=val;persist(c);} }
function updateUnit(id,val) { const c=card(id); if(c){c.unit=val;persist(c);} }

function cycleIcon(id) {
  const c=card(id); if(!c) return;
  const i=ICONS.indexOf(c.icon);
  c.icon=ICONS[(i+1)%ICONS.length];
  persist(c);
}

function toggleLog(id) {
  const w=document.getElementById(`logtable-${id}`);
  const b=document.getElementById(`toggle-${id}`);
  b.classList.toggle('open',w.classList.toggle('visible'));
}

// ── Render ───────────────────────────────────────────────────────────────────
const chartInst={};

window.renderAll = function() {
  const grid=document.getElementById('grid'); if(!grid) return;
  const open=new Set(); document.querySelectorAll('.log-table-wrap.visible').forEach(el=>open.add(el.id.replace('logtable-','')));
  grid.innerHTML='';
  const cards=window._cards||[];
  if(!cards.length){
    grid.innerHTML=`<div class="empty"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" style="margin:0 auto 12px;display:block;opacity:.2"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#5c6380" stroke-width="1.5"/><path d="M12 8v8M8 12h8" stroke="#5c6380" stroke-width="1.5" stroke-linecap="round"/></svg><p>No exercises yet. Click <strong style="color:#dde1f0">Add Exercise</strong> to begin.</p></div>`;
    return;
  }
  cards.forEach(c=>{
    grid.appendChild(buildCard(c));
    updateChart(c.id);
    if(open.has(c.id)){document.getElementById(`logtable-${c.id}`)?.classList.add('visible');document.getElementById(`toggle-${c.id}`)?.classList.add('open');}
  });
};

function buildCard(c) {
  const entries=c.entries||[];
  const sorted=[...entries].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const total=entries.reduce((s,e)=>s+e.amount,0);
  const avg=entries.length?(total/entries.length).toFixed(1):'—';
  const best=entries.length?Math.max(...entries.map(e=>e.amount)):'—';
  const div=document.createElement('div');
  div.className='card'; div.id=`card-${c.id}`;
  div.innerHTML=`
    <div class="card-line" style="background:${c.color}"></div>
    <div class="card-header">
      <div class="name-wrap">
        <div class="ex-icon" onclick="cycleIcon('${c.id}')" title="Click to change icon">${c.icon}</div>
        <input class="ex-name" value="${esc(c.name)}" placeholder="Exercise Name" onblur="updateName('${c.id}',this.value)">
      </div>
      <div class="card-btns">
        <button class="icon-btn" onclick="deleteCard('${c.id}')" title="Delete">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 1l9 9M10 1l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="unit-row">
      <label>Unit</label>
      <input class="unit-input" value="${esc(c.unit)}" placeholder="reps/miles/min" onblur="updateUnit('${c.id}',this.value)">
    </div>
    <div class="stat-bar">
      <div class="stat"><span class="stat-val" style="color:${c.color}">${entries.length}</span><span class="stat-lbl">Entries</span></div>
      <div class="sdiv"></div>
      <div class="stat"><span class="stat-val" style="color:${c.color}">${avg}</span><span class="stat-lbl">Avg ${esc(c.unit)}</span></div>
      <div class="sdiv"></div>
      <div class="stat"><span class="stat-val" style="color:${c.color}">${best}</span><span class="stat-lbl">Best</span></div>
    </div>
    <div class="entry-form">
      <div class="field"><label>Date</label><input type="date" id="date-${c.id}" value="${today()}"></div>
      <div class="field"><label>Amount (${esc(c.unit)})</label><input type="number" id="amt-${c.id}" placeholder="0" min="0" step="any" onkeydown="if(event.key==='Enter')logEntry('${c.id}')"></div>
      <button class="log-btn" onclick="logEntry('${c.id}')">Log</button>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-${c.id}"></canvas>
      ${sorted.length<2?`<div class="no-data" id="nodata-${c.id}"><svg width="33" height="33" viewBox="0 0 24 24" fill="none"><polyline points="3,17 8,12 13,15 21,7" stroke="#5c6380" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Log 2+ entries to see your chart</span></div>`:''}
    </div>
    <div class="log-section">
      <button class="log-toggle" id="toggle-${c.id}" onclick="toggleLog('${c.id}')">
        <svg class="chev" width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 3.5l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        History (${entries.length})
      </button>
      <div class="log-table-wrap" id="logtable-${c.id}">
        <table class="log-table">
          <thead><tr><th>Date</th><th>Amount</th><th></th></tr></thead>
          <tbody>${sorted.slice().reverse().map(e=>`<tr><td>${fmtD(e.date)}</td><td>${e.amount} ${esc(c.unit)}</td><td class="del" onclick="deleteEntry('${c.id}','${e.id}')">✕</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  return div;
}

function updateChart(id) {
  const c=card(id); if(!c) return;
  const sorted=[...(c.entries||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const canvas=document.getElementById(`chart-${id}`); if(!canvas) return;
  if(sorted.length<2){ if(chartInst[id]){chartInst[id].destroy();delete chartInst[id];} return; }
  document.getElementById(`nodata-${id}`)?.remove();
  if(chartInst[id]) chartInst[id].destroy();
  const wrap=canvas.parentElement;
  const W=wrap.clientWidth-26, H=wrap.clientHeight-22;
  canvas.width=W; canvas.height=H;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  chartInst[id]=new Chart(canvas,{
    type:'line',
    data:{
      labels:sorted.map(e=>fmtD(e.date)),
      datasets:[{data:sorted.map(e=>e.amount),borderColor:c.color,backgroundColor:hexRgba(c.color,.07),borderWidth:2.5,pointBackgroundColor:c.color,pointRadius:4,pointHoverRadius:6,tension:.35,fill:true}]
    },
    options:{
      responsive:false,maintainAspectRatio:false,animation:{duration:340},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#181c28',borderColor:'#252b3d',borderWidth:1,titleColor:'#5c6380',bodyColor:'#dde1f0',callbacks:{label:ctx=>` ${ctx.parsed.y} ${c.unit}`}}},
      scales:{
        x:{grid:{color:'rgba(37,43,61,.55)',drawBorder:false},ticks:{color:'#5c6380',font:{family:'DM Sans',size:10},maxRotation:30},border:{display:false}},
        y:{grid:{color:'rgba(37,43,61,.55)',drawBorder:false},ticks:{color:'#5c6380',font:{family:'DM Sans',size:10}},border:{display:false}}
      }
    }
  });
}
</script>
</body>
</html>
