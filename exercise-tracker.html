<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LiftLog — Exercise Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
  import { initializeApp }                              from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { initializeFirestore, getFirestore,
           persistentLocalCache, persistentMultipleTabManager,
           collection, doc, setDoc, updateDoc, deleteDoc, getDoc,
           writeBatch, runTransaction, arrayUnion, arrayRemove,
           onSnapshot, query, orderBy }                 from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut,
           createUserWithEmailAndPassword,
           signInWithEmailAndPassword,
           GoogleAuthProvider, signInWithPopup,
           signInWithRedirect, getRedirectResult,
           fetchSignInMethodsForEmail, linkWithCredential,
           sendPasswordResetEmail }                     from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ─────────────────────────────────────────────────────────────────────────
  // 🔧 PASTE YOUR FIREBASE CONFIG OBJECT HERE
  // ─────────────────────────────────────────────────────────────────────────
  const firebaseConfig = {
  apiKey: "AIzaSyCQMNCRENtWsZ_ulSeWheErkghbkh4O09g",
  authDomain: "liftlog-45dad.firebaseapp.com",
  projectId: "liftlog-45dad",
  storageBucket: "liftlog-45dad.firebasestorage.app",
  messagingSenderId: "792245724759",
  appId: "1:792245724759:web:bbc7dde44103b09056e512",
  measurementId: "G-K504665W17"
};
  // ─────────────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);

  // Offline persistence: writes are stored in IndexedDB and synced when the
  // connection returns, even if the tab is closed in between. If IndexedDB is
  // unavailable (e.g. some private modes) the SDK falls back to memory.
  let db;
  try {
    db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });
  } catch (e) {
    console.warn('[LiftLog] Offline persistence unavailable, using memory cache.', e);
    db = getFirestore(app);
  }
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();

  let unsubCards = null;
  let listenUid  = null;

  // ── Auth state ────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, user => {
    if (user) {
      showApp(user);
    } else {
      showAuth();
    }
  });

  function showAuth() {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display  = 'none';
    stopListening();
    window.resetCards();
  }

  function showApp(user) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display  = 'block';
    document.getElementById('user-email').textContent    = user.displayName || user.email;
    document.getElementById('user-avatar').textContent   = (user.displayName || user.email || '?')[0].toUpperCase();
    document.getElementById('user-pill').title           = user.email || '';
    if (listenUid !== user.uid) startListening(user.uid);
  }

  // ── Live data + sync status ───────────────────────────────────────────────
  const DEFAULT_EXERCISES = [
    { id: 'default-pushups', name: 'Push-Ups', unit: 'reps',  color: '#e8ff47' },
    { id: 'default-running', name: 'Running',  unit: 'miles', color: '#47b4ff' },
  ];

  let syncMeta = { pending: false, fromCache: true, everSynced: false };

  function stopListening() {
    if (unsubCards) { unsubCards(); unsubCards = null; }
    listenUid = null;
  }

  function startListening(uid) {
    stopListening();
    listenUid = uid;
    syncMeta  = { pending: false, fromCache: true, everSynced: false };
    updateSyncIndicator();

    let seedState = 'unknown';   // unknown → checking → done
    let first     = true;
    const q = query(collection(db, 'users', uid, 'exercises'), orderBy('createdAt'));

    unsubCards = onSnapshot(q, { includeMetadataChanges: true }, snap => {
      if (listenUid !== uid) return;

      syncMeta.pending   = snap.metadata.hasPendingWrites;
      syncMeta.fromCache = snap.metadata.fromCache;
      if (!snap.metadata.fromCache) syncMeta.everSynced = true;
      updateSyncIndicator();

      const incoming = [];
      snap.forEach(d => incoming.push({ id: d.id, ...d.data() }));

      // Seed defaults once per account, and only after hearing from the
      // server, so an empty offline cache can't trigger a re-seed.
      if (seedState === 'unknown' && !snap.metadata.fromCache) {
        seedState = 'checking';
        ensureSeeded(uid, incoming.length === 0)
          .catch(err => console.error('[LiftLog] Seed check failed:', err))
          .finally(() => {
            seedState = 'done';
            if (listenUid === uid) window.setCards(window._cards || [], true);
          });
      }

      // Metadata-only snapshots (e.g. a write being confirmed) don't change
      // any data, so skip the re-render.
      if (!first && snap.docChanges().length === 0) return;
      first = false;

      // Until we know whether this account should be seeded, an empty list
      // means "still loading", not "no exercises".
      const ready = incoming.length > 0 || seedState === 'done';
      window.setCards(incoming, ready);
    }, err => {
      console.error('[LiftLog] Firestore listener error:', err);
      showToast(`Couldn't load data (${err.code || 'error'})`, 'error', 6000);
    });
  }

  async function ensureSeeded(uid, isEmpty) {
    const metaRef = doc(db, 'users', uid, 'meta', 'settings');
    const meta = await getDoc(metaRef);
    if (meta.exists() && meta.data().seeded) return;
    const batch = writeBatch(db);
    if (isEmpty) {
      const now = Date.now();
      DEFAULT_EXERCISES.forEach(({ id, ...data }, i) => {
        batch.set(doc(db, 'users', uid, 'exercises', id), { ...data, entries: [], createdAt: now + i });
      });
    }
    // Existing accounts with data get the flag too, so deleting everything
    // later leaves the list empty.
    batch.set(metaRef, { seeded: true }, { merge: true });
    guard(batch.commit(), 'defaults');
  }

  function updateSyncIndicator() {
    const el = document.getElementById('sync');
    if (!el) return;
    const online = navigator.onLine;
    let state, text, title;
    if (!online || (syncMeta.fromCache && syncMeta.everSynced)) {
      state = 'offline'; text = 'Offline';
      title = syncMeta.pending ? 'Changes are saved on this device and will sync when you reconnect.' : 'Working offline.';
    } else if (syncMeta.fromCache) {
      state = 'saving';  text = 'Connecting…'; title = 'Connecting to the server…';
    } else if (syncMeta.pending) {
      state = 'saving';  text = 'Saving…';     title = 'Saving your changes…';
    } else {
      state = 'saved';   text = 'Saved';       title = 'All changes saved.';
    }
    el.dataset.state = state;
    el.title = title;
    el.setAttribute('aria-label', text);
    el.querySelector('.sync-text').textContent = text;
  }
  window.addEventListener('online',  updateSyncIndicator);
  window.addEventListener('offline', updateSyncIndicator);

  // ── Firestore writes ──────────────────────────────────────────────────────
  // Writes never block the UI: the local cache (and therefore the snapshot
  // listener) updates immediately. With offline persistence the promise only
  // settles once the server confirms, so we just report failures.
  function guard(promise, what) {
    return Promise.resolve(promise).catch(err => {
      console.error(`[LiftLog] Failed to save ${what}:`, err);
      showToast(`Couldn't save ${what} (${err && err.code || 'unknown error'})`, 'error', 6000);
    });
  }

  function run(what, fn) {
    try { return guard(fn(), what); }
    catch (err) { return guard(Promise.reject(err), what); }
  }

  function exRef(id) {
    const user = auth.currentUser;
    if (!user) throw Object.assign(new Error('Not signed in'), { code: 'unauthenticated' });
    return doc(db, 'users', user.uid, 'exercises', id);
  }

  window.LL = {
    createExercise: card       => run('exercise', () => { const { id, ...data } = card; return setDoc(exRef(id), data); }),
    updateExercise: (id, data) => run('change',   () => updateDoc(exRef(id), data)),
    addEntry:      (id, entry) => run('entry',    () => updateDoc(exRef(id), { entries: arrayUnion(entry) })),
    removeEntry:   (id, entry) => run('deletion', () => updateDoc(exRef(id), { entries: arrayRemove(entry) })),
    deleteExercise: id         => run('deletion', () => deleteDoc(exRef(id))),
    // One-time cleanup: in "reps" exercises, move counts typed into Amount
    // (before the Reps field existed) into reps. One transaction per exercise
    // re-reads the server copy, so entries added elsewhere are never lost.
    migrateLegacyReps: async ids => {
      let moved = 0, failed = 0;
      for (const id of ids) {
        try {
          moved += await runTransaction(db, async tx => {
            const ref  = exRef(id);
            const snap = await tx.get(ref);
            if (!snap.exists() || !window.isRepsUnit(snap.data().unit)) return 0;
            let n = 0;
            const entries = (snap.data().entries || []).map(e => {
              if (!window.isLegacyRepsEntry(e)) return e;
              n++;
              const { amount, ...rest } = e;
              return { ...rest, reps: amount };
            });
            if (n) tx.update(ref, { entries });
            return n;
          });
        } catch (err) {
          failed++;
          console.error(`[LiftLog] Cleanup failed for ${id}:`, err);
          showToast(`Couldn't update old entries (${err && err.code || 'unknown error'})`, 'error', 6000);
        }
      }
      return { moved, failed };
    },
  };

  // ── Auth actions ──────────────────────────────────────────────────────────
  // Google credential waiting to be linked after the user signs in with their
  // password (see auth/account-exists-with-different-credential below).
  let pendingGoogleCred = null;

  async function signInMethods(email) {
    try { return await fetchSignInMethodsForEmail(auth, email); }
    catch { return []; }   // empty when email-enumeration protection is on
  }

  window.doSignUp = async () => {
    const email = document.getElementById('auth-email').value.trim();
    const pass  = document.getElementById('auth-pass').value;
    if (!email || !pass) return setAuthError('Please enter email and password.');
    try {
      clearAuthError();
      await createUserWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      if (e.code === 'auth/email-already-in-use') {
        const methods = await signInMethods(email);
        if (methods.includes('google.com') && !methods.includes('password'))
          return setAuthError('This email is already registered with Google. Tap "Continue with Google" to sign in — no new account needed.');
        return setAuthError('That email is already registered. Sign in instead — or tap "Continue with Google" if that\'s how you signed up.');
      }
      setAuthError(friendlyError(e.code));
    }
  };

  window.doSignIn = async () => {
    const email = document.getElementById('auth-email').value.trim();
    const pass  = document.getElementById('auth-pass').value;
    if (!email || !pass) return setAuthError('Please enter email and password.');
    try {
      clearAuthError();
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      if (pendingGoogleCred) {
        const gc = pendingGoogleCred; pendingGoogleCred = null;
        linkWithCredential(cred.user, gc)
          .then(() => showToast('Google sign-in linked to your account ✓', 'success'))
          .catch(err => console.error('[LiftLog] Linking Google failed:', err));
      }
    } catch(e) {
      if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(e.code)) {
        const methods = await signInMethods(email);
        if (methods.includes('google.com') && !methods.includes('password'))
          return setAuthError('This email is registered with Google. Tap "Continue with Google" to sign in.');
        if (!methods.length)
          return setAuthError('Incorrect email or password. If you signed up with Google, tap "Continue with Google" instead.');
      }
      setAuthError(friendlyError(e.code));
    }
  };

  function handleGoogleError(e) {
    if (['auth/popup-closed-by-user','auth/cancelled-popup-request','auth/user-cancelled'].includes(e.code)) return;
    if (e.code === 'auth/account-exists-with-different-credential') {
      pendingGoogleCred = GoogleAuthProvider.credentialFromError(e);
      const email = e.customData && e.customData.email;
      if (email) document.getElementById('auth-email').value = email;
      setAuthError(`${email || 'This email'} already has a LiftLog account with a password. Sign in with your password below and Google will be linked to the same account.`);
      return;
    }
    console.error('[LiftLog] Google sign-in failed:', e);
    setAuthError(friendlyError(e.code));
  }

  window.doGoogle = async () => {
    try {
      clearAuthError();
      await signInWithPopup(auth, provider);
    } catch(e) {
      // Popups are often blocked in in-app browsers / app webviews.
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
        try { await signInWithRedirect(auth, provider); } catch(e2) { handleGoogleError(e2); }
        return;
      }
      handleGoogleError(e);
    }
  };
  getRedirectResult(auth).catch(handleGoogleError);

  window.doSignOut = async () => {
    stopListening();
    window.resetCards();
    await signOut(auth);
  };

  window.doReset = async () => {
    const email = document.getElementById('auth-email').value.trim();
    if (!email) return setAuthError('Enter your email above first.');
    try {
      await sendPasswordResetEmail(auth, email);
      setAuthError('Password reset email sent! Check your inbox.', true);
    } catch(e) { setAuthError(friendlyError(e.code)); }
  };

  function setAuthError(msg, ok=false) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.color = ok ? 'var(--success)' : 'var(--danger)';
    el.style.display = 'block';
  }
  function clearAuthError() {
    const el = document.getElementById('auth-error');
    el.style.display = 'none';
  }

  function friendlyError(code) {
    const map = {
      'auth/email-already-in-use':    'That email is already registered. Try signing in.',
      'auth/invalid-email':           'Please enter a valid email address.',
      'auth/weak-password':           'Password must be at least 6 characters.',
      'auth/user-not-found':          'No account found with that email.',
      'auth/wrong-password':          'Incorrect password. Try again or reset it.',
      'auth/invalid-credential':      'Incorrect email or password.',
      'auth/too-many-requests':       'Too many attempts. Please wait a moment.',
      'auth/network-request-failed':  'Network error. Check your connection.',
      'auth/invalid-api-key':         'Firebase API key is invalid — check your config.',
      'auth/configuration-not-found':  'Firebase auth is not configured correctly.',
      'auth/unauthorized-domain':     'This site isn\'t authorized for sign-in. Add it in Firebase Console → Authentication → Settings.',
    };
    return map[code] || `Something went wrong (${code || 'unknown'}). Please try again.`;
  }

  window.togglePass = function() {
    const inp = document.getElementById('auth-pass');
    const icon = document.getElementById('eye-icon');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    icon.innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><circle cx="12" cy="12" r="3" opacity="0"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  };
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12;--surface:#12151e;--surface2:#181c28;--border:#252b3d;
  --accent:#e8ff47;--accent2:#47b4ff;--text:#dde1f0;--muted:#8b93b0;--label:#c3c9dc;
  --danger:#ff5252;--success:#47ffb4;--warn:#ff8c47;--radius:14px;
}
/* Safety net against horizontal overflow. html's overflow goes to the
   viewport (keeps sticky header working); body uses clip, which unlike
   hidden doesn't turn body into a scroll container. */
html{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:clip}
[hidden]{display:none!important}

/* ── Auth Screen ─────────────────────────────────────────────────────────── */
#auth-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
  background:radial-gradient(ellipse at 60% 20%, rgba(232,255,71,.06) 0%, transparent 60%),
             radial-gradient(ellipse at 20% 80%, rgba(71,180,255,.05) 0%, transparent 50%),
             var(--bg);
}

.auth-box{
  width:100%;max-width:400px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px 32px 32px;
  display:flex;flex-direction:column;gap:20px;
}

.auth-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.4rem;letter-spacing:.14em;
  color:var(--accent);line-height:1;text-align:center;
}
.auth-logo span{color:var(--text)}
.auth-tagline{text-align:center;font-size:.83rem;color:var(--muted);margin-top:4px}

.auth-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.75rem}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}

.auth-fields{display:flex;flex-direction:column;gap:10px}
.pass-wrap{position:relative;display:flex;align-items:center}
.pass-wrap .auth-input{padding-right:42px}
.pass-toggle{position:absolute;right:11px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:color .15s}
.pass-toggle:hover{color:var(--accent2)}

.auth-input{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:11px 14px;border-radius:9px;
  font-family:'DM Sans',sans-serif;font-size:.9rem;
  outline:none;width:100%;transition:border-color .15s;
}
.auth-input:focus{border-color:var(--accent)}
.auth-input::placeholder{color:var(--muted)}

.auth-btn{
  width:100%;padding:11px;border:none;border-radius:9px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;
  cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;
  letter-spacing:.02em;
}
.auth-btn:active{transform:scale(.97)}
.auth-btn.primary{background:var(--accent);color:#0b0d12}
.auth-btn.primary:hover{box-shadow:0 4px 18px rgba(232,255,71,.25)}
.auth-btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.auth-btn.secondary:hover{border-color:#5c6380}

.google-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:11px;border-radius:9px;
  background:#fff;color:#1f1f1f;border:none;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;
  cursor:pointer;transition:box-shadow .15s,transform .12s;
}
.google-btn:hover{box-shadow:0 2px 12px rgba(255,255,255,.15)}
.google-btn:active{transform:scale(.97)}
.google-btn svg{flex-shrink:0}

.auth-links{display:flex;justify-content:space-between;font-size:.78rem}
.auth-link{background:none;border:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.78rem;padding:0;transition:color .15s}
.auth-link:hover{color:var(--accent2)}

#auth-error{display:none;font-size:.8rem;text-align:center;padding:8px 12px;background:rgba(255,82,82,.08);border-radius:7px;border:1px solid rgba(255,82,82,.2)}

/* ── App Screen ──────────────────────────────────────────────────────────── */
#app-screen{display:none;padding-bottom:calc(60px + env(safe-area-inset-bottom))}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top)) max(36px,env(safe-area-inset-right)) 18px max(36px,env(safe-area-inset-left));border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,13,18,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:100}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:.14em;color:var(--accent);line-height:1;flex-shrink:0}
.logo span{color:var(--text)}
.hright{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px;min-width:0}

.sync{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0}
.sync[data-state="saving"] .sync-dot{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.sync[data-state="offline"] .sync-dot{background:var(--warn)}
.sync[data-state="offline"]{color:var(--warn)}

.user-pill{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:40px;padding:5px 12px 5px 6px;min-width:0}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#0b0d12;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-email{font-size:.78rem;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.signout-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.signout-btn:hover{color:var(--danger);border-color:var(--danger)}

.add-btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#0b0d12;border:none;padding:9px 17px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.86rem;cursor:pointer;border-radius:8px;white-space:nowrap;flex-shrink:0;transition:transform .15s,box-shadow .15s}
.add-btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(232,255,71,.22)}

/* Toast */
#toast{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(70px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 20px;border-radius:20px;font-size:.83rem;font-weight:500;opacity:0;transition:transform .28s,opacity .28s;pointer-events:none;z-index:999;width:max-content;max-width:calc(100vw - 32px);text-align:center;overflow-wrap:anywhere}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.error{border-color:var(--danger);color:var(--danger)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr));gap:24px;padding:28px 36px}

/* Card */
.card{--c:var(--accent);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0;animation:up .28s ease;transition:box-shadow .2s}
.card:hover{box-shadow:0 8px 30px rgba(0,0,0,.28)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card-line{height:3px;width:100%;background:var(--c)}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 11px;border-bottom:1px solid var(--border);gap:9px}
.name-wrap{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.ex-name{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.08em;color:var(--text);background:transparent;border:none;outline:none;width:100%;min-width:0}
.ex-name::placeholder{color:var(--muted)}
.card-btns{display:flex;gap:5px}
.icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.collapse-btn:hover{color:var(--text);border-color:var(--muted)}
.collapse-btn svg{transition:transform .2s}
/* Collapsed card: only the colour line and the title row stay visible. */
.card.collapsed>:not(.card-line):not(.card-header){display:none}
.card.collapsed .card-header{border-bottom:none;padding-bottom:13px}
.card.collapsed .collapse-btn svg{transform:rotate(180deg)}
.card.collapsed{align-self:start}
.card.collapsed .card-header{cursor:pointer}
.card.collapsed .ex-name{pointer-events:none}
.unit-row{display:flex;align-items:center;gap:9px;padding:9px 16px 0}
.unit-row label{font-size:.75rem;color:var(--label);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.unit-input::placeholder{color:var(--muted);opacity:1}
.unit-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.82rem;width:110px;outline:none;transition:border-color .15s}
.unit-input:focus{border-color:var(--accent2)}
.stat-bar{display:flex;padding:9px 16px 11px;border-bottom:1px solid var(--border)}
.stat{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.05em;line-height:1;color:var(--c)}
.stat-lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdiv{width:1px;background:var(--border);margin:0 10px}
.entry-form{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr) auto;align-items:end;gap:8px;padding:11px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;color:var(--label);text-transform:uppercase;letter-spacing:.07em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.86rem;outline:none;width:100%;min-width:0;height:35px;transition:border-color .15s}
.lbl-short{display:none}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--muted);opacity:1}
.field input.error{border-color:var(--danger)!important}
.field input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.4);cursor:pointer}
/* iOS Safari: native date inputs have an intrinsic min width and ignore
   width:100% unless the native appearance is removed. */
@supports (-webkit-touch-callout:none){
  .field input[type="date"]{-webkit-appearance:none;appearance:none;display:block;line-height:19px}
  .field input[type="date"]::-webkit-date-and-time-value{text-align:left}
}
.last-hint{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-bottom:2px}
.last-hint b{color:var(--label);font-weight:600}
.log-btn{background:var(--accent);color:#0b0d12;border:none;padding:7px 15px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.84rem;border-radius:7px;cursor:pointer;height:35px;white-space:nowrap;transition:background .15s,transform .1s}
.log-btn:hover{background:#d4eb30}
.log-btn:active{transform:scale(.96)}
.chart-wrap{padding:13px 13px 9px;height:190px;position:relative;flex-shrink:0}
.chart-box{position:relative;width:100%;height:100%;min-width:0}
.no-data{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:.8rem}
.no-data svg{opacity:.22}
.log-section{border-top:1px solid var(--border)}
.log-toggle{width:100%;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;padding:8px 16px;text-align:left;display:flex;align-items:center;gap:6px;transition:color .15s}
.log-toggle:hover{color:var(--text)}
.chev{transition:transform .2s}
.log-toggle.open .chev{transform:rotate(180deg)}
.log-table-wrap{display:none;padding:0 16px 11px;max-height:148px;overflow-y:auto}
.log-table-wrap.visible{display:block}
.log-table{width:100%;border-collapse:collapse;font-size:.79rem}
.log-table td{padding:4px 0;border-bottom:1px solid rgba(37,43,61,.5)}
.log-table tr.day td{padding-top:9px;color:var(--label);font-weight:600;border-bottom:1px solid var(--border)}
.log-table tr.day:first-child td{padding-top:3px}
.log-table tr.day .day-total{float:right;color:var(--c)}
.log-table td.set-no{color:var(--muted);width:40px;padding-left:4px}
.log-table td.del{text-align:right;color:var(--muted);cursor:pointer}
.log-table td.del:hover{color:var(--danger)}
/* One-time data cleanup panel */
.cleanup{margin:20px 36px 0;padding:14px 16px;background:var(--surface);border:1px solid var(--warn);border-radius:var(--radius);font-size:.84rem;display:flex;flex-direction:column;gap:10px}
.cleanup-list{max-height:220px;overflow-y:auto}
.cleanup-list table{width:100%;border-collapse:collapse;font-size:.8rem}
.cleanup-list th{color:var(--muted);text-align:left;font-weight:500;padding:3px 6px 3px 0;border-bottom:1px solid var(--border)}
.cleanup-list td{padding:4px 6px 4px 0;border-bottom:1px solid rgba(37,43,61,.5)}
.cleanup-btns{display:flex;gap:8px;flex-wrap:wrap}
.cleanup-btns button{padding:7px 14px;border-radius:7px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.cleanup-btns button.primary{background:var(--accent);color:#0b0d12;border-color:var(--accent)}
.cleanup-btns button:disabled{opacity:.5;cursor:default}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media(max-width:600px){
  header{padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
  .grid{padding:18px 14px;gap:16px;grid-template-columns:minmax(0,1fr)}
  .logo{font-size:1.6rem}
  .user-email,.sync-text{display:none}
  .user-pill{padding:5px}
  .auth-box{padding:28px 20px 24px}
  /* ≥16px stops iOS Safari from zooming in when an input is focused */
  .auth-input,.field input,.unit-input{font-size:16px}
  .ex-name{font-size:max(16px,1.25rem)}
  .entry-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .cleanup{margin:14px 14px 0}
  .field-date{grid-column:1/-1}
  .field label{letter-spacing:.03em}
  .lbl-long{display:none}
  .lbl-short{display:inline}
}
@media(max-width:440px){
  .hright{gap:8px}
  .add-label{display:none}
  .add-btn{width:36px;height:36px;padding:0}
  .signout-btn{padding:6px 10px}
}
@media(max-width:360px){
  .logo{font-size:1.35rem;letter-spacing:.1em}
  .signout-btn{padding:6px 8px;font-size:.72rem}
}
</style>
</head>
<body>

<!-- ── Auth Screen ─────────────────────────────────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-box">
    <div>
      <div class="auth-logo">LIFT<span>LOG</span></div>
      <div class="auth-tagline">Track your workouts. Own your progress.</div>
    </div>

    <button class="google-btn" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or use email</div>

    <div class="auth-fields">
      <input class="auth-input" id="auth-email" type="email" placeholder="Email address" autocomplete="email">
      <div class="pass-wrap">
        <input class="auth-input" id="auth-pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doSignIn()">
        <button class="pass-toggle" type="button" onclick="togglePass()" title="Show/hide password" aria-label="Toggle password visibility">
          <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="auth-error"></div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="auth-btn primary" onclick="doSignIn()">Sign In</button>
      <button class="auth-btn secondary" onclick="doSignUp()">Create Account</button>
    </div>

    <div class="auth-links">
      <button class="auth-link" onclick="doReset()">Forgot password?</button>
    </div>
  </div>
</div>

<!-- ── App Screen ─────────────────────────────────────────────────────────── -->
<div id="app-screen">
  <header>
    <div class="logo">LIFT<span>LOG</span></div>
    <div class="hright">
      <div class="sync" id="sync" data-state="saving" role="status" aria-live="polite"><span class="sync-dot"></span><span class="sync-text">Connecting…</span></div>
      <div class="user-pill" id="user-pill">
        <div class="user-avatar" id="user-avatar">?</div>
        <span class="user-email" id="user-email"></span>
      </div>
      <button class="signout-btn" onclick="doSignOut()">Sign Out</button>
      <button class="add-btn" onclick="addCard()" aria-label="Add Exercise" title="Add Exercise">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="add-label">Add Exercise</span>
      </button>
    </div>
  </header>
  <div class="cleanup" id="cleanup" hidden></div>
  <div class="grid" id="grid"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const PALETTE=['#e8ff47','#47b4ff','#ff8c47','#b047ff','#47ffb4','#ff4787','#ff47d4','#47ffd4'];

function gid()       { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today()     { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtD(d)     { if(!d)return''; const[y,m,day]=d.split('-'); return`${m}/${day}/${y.slice(2)}`; }
function esc(s)      { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hexRgba(h,a){ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return`rgba(${r},${g},${b},${a})`; }
function card(id)    { return (window._cards||[]).find(c=>c.id===id); }
function fmtMD(d)    { if(!d)return''; const[,m,day]=d.split('-'); return`${m}/${day}`; }
function fmtNum(n,max=2) { return Number(n).toLocaleString('en-US',{maximumFractionDigits:max}); }
function nextColor() { return PALETTE[(window._cards||[]).length%PALETTE.length]; }

// ── Entry model ──────────────────────────────────────────────────────────────
// Each stored entry is one set: { id, date, amount?, reps? } (either may be
// missing). Before the Reps field existed, bodyweight reps were typed into
// Amount; for exercises whose unit is "reps", setOf() reads those as reps so
// old and new entries look identical, before and after the one-time cleanup.
const isNum=x=>typeof x==='number'&&Number.isFinite(x);
window.isRepsUnit=u=>/^\s*reps?\s*$/i.test(u||'');
window.isLegacyRepsEntry=e=>!!e&&isNum(e.amount)&&!isNum(e.reps);   // when unit is "reps"

function setOf(e,unit) {
  let amt=isNum(e.amount)?e.amount:null, reps=isNum(e.reps)?e.reps:null;
  if(reps===null&&amt!==null&&isRepsUnit(unit)){ reps=amt; amt=null; }
  return {amt,reps};
}
// What one set adds to its day's total: weight × reps (volume), else reps, else amount.
function setValue(s) { return s.amt!==null&&s.reps!==null ? s.amt*s.reps : s.reps!==null ? s.reps : (s.amt??0); }
// Compact form for breakdowns and hints: "185×8", "12", "2.5"
function setToken(s) { return s.amt!==null&&s.reps!==null ? `${fmtNum(s.amt)}×${s.reps}` : fmtNum(s.reps??s.amt??0); }
// Full form for history rows and toasts: "185 lbs × 8", "12 reps", "2 miles"
function setText(s,unit) {
  if(s.amt!==null&&s.reps!==null) return `${fmtNum(s.amt)} ${unit} × ${s.reps}`.replace(/\s+/g,' ');
  if(s.reps!==null) return `${s.reps} reps`;
  return `${fmtNum(s.amt??0)} ${unit}`.trim();
}

// Group an exercise's sets by date (oldest first). Within a date the array
// order is the order logged, so set numbers come from position: deleting a set
// renumbers the rest with no gaps.
function analyze(c) {
  const unit=c.unit||'', byDate=new Map();
  (c.entries||[]).forEach(e=>{
    if(!e||!e.date) return;
    if(!byDate.has(e.date)) byDate.set(e.date,[]);
    byDate.get(e.date).push({...setOf(e,unit),entry:e});
  });
  const days=[...byDate.keys()].sort().map(date=>{
    const sets=byDate.get(date); sets.forEach((s,i)=>s.n=i+1);
    return {date,sets,total:sets.reduce((t,s)=>t+setValue(s),0)};
  });
  const all=days.flatMap(d=>d.sets);
  const metric=all.some(s=>s.amt!==null&&s.reps!==null) ? {label:`${unit} volume`.trim(),sep:', '}
             : all.some(s=>s.reps!==null)               ? {label:'reps',sep:' + '}
             :                                            {label:unit,sep:' + '};
  return {unit,days,metric,count:all.length};
}
function fmtTotal(total,metric) { return `${fmtNum(total)} ${metric.label}`.trim(); }

let _tt;
window.showToast = function(msg,type='',ms=2800) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(_tt); _tt=setTimeout(()=>t.className='',ms);
};

// ── Mutations ────────────────────────────────────────────────────────────────
// Cards in window._cards are the latest Firestore snapshot and are never
// mutated here: every change is a field-level write, and the snapshot listener
// (which fires immediately from the local cache) re-renders.
let pendingFocusId=null;

function addCard() {
  const c={id:gid(),name:'New Exercise',unit:'reps',color:nextColor(),entries:[],createdAt:Date.now()};
  pendingFocusId=c.id;
  window.LL.createExercise(c);
  showToast('Exercise added ✓','success');
}

function deleteCard(id) {
  if(!confirm('Delete this exercise and all its data?')) return;
  window.LL.deleteExercise(id);
  showToast('Exercise deleted','error');
}

function logEntry(id) {
  const c=card(id), v=views.get(id); if(!c||!v) return;
  const dEl=v.el.querySelector('.in-date'), aEl=v.el.querySelector('.in-amt'), rEl=v.el.querySelector('.in-reps');
  const flag=(...els)=>els.forEach(el=>{el.classList.add('error');setTimeout(()=>el.classList.remove('error'),800);});
  if(!dEl.value){flag(dEl);return;}
  // A set needs Amount, Reps, or both. badInput = non-numeric text typed in.
  const amtBlank=aEl.value.trim()===''&&!aEl.validity.badInput, repsBlank=rEl.value.trim()===''&&!rEl.validity.badInput;
  if(amtBlank&&repsBlank){flag(aEl,rEl);return;}
  const entry={id:gid(),date:dEl.value};
  if(!amtBlank){
    const amt=Number(aEl.value);
    if(aEl.validity.badInput||!Number.isFinite(amt)||amt<0){flag(aEl);return;}
    entry.amount=amt;
  }
  if(!repsBlank){
    const reps=Number(rEl.value);
    if(rEl.validity.badInput||!Number.isInteger(reps)||reps<0){flag(rEl);return;}
    entry.reps=reps;
  }
  // In a "reps" exercise a lone number is a rep count: store it as reps.
  if(isRepsUnit(c.unit)&&entry.reps===undefined&&Number.isInteger(entry.amount)){ entry.reps=entry.amount; delete entry.amount; }
  const n=(analyze(c).days.find(d=>d.date===entry.date)?.sets.length||0)+1;
  window.LL.addEntry(id,entry);
  aEl.value=''; rEl.value='';
  showToast(`Logged Set ${n}: ${setText(setOf(entry,c.unit),c.unit)} ✓`,'success');
}

function deleteEntry(cid,eid) {
  const c=card(cid); if(!c) return;
  // arrayRemove needs the exact stored object, so pass the one from the snapshot.
  const e=(c.entries||[]).find(e=>e.id===eid); if(!e) return;
  window.LL.removeEntry(cid,e);
}

function updateField(id,field,val) {
  const c=card(id); if(!c||c[field]===val) return;
  window.LL.updateExercise(id,{[field]:val});
}

// Collapsed cards are a per-device view preference, so they live in
// localStorage rather than Firestore (phone collapsed, desktop expanded).
const COLLAPSE_KEY='liftlog.collapsed';
const collapsed=(()=>{ try{ return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY)||'[]')); }catch{ return new Set(); } })();
function saveCollapsed() {
  const ids=new Set((window._cards||[]).map(c=>c.id));
  collapsed.forEach(id=>{ if(ids.size&&!ids.has(id)) collapsed.delete(id); });
  try{ localStorage.setItem(COLLAPSE_KEY,JSON.stringify([...collapsed])); }catch{}
}
function applyCollapsed(el,isCollapsed) {
  el.classList.toggle('collapsed',isCollapsed);
  const b=el.querySelector('.collapse-btn');
  b.setAttribute('aria-expanded',String(!isCollapsed));
  el.querySelector('.ex-name').tabIndex=isCollapsed?-1:0;
  b.title=isCollapsed?'Expand':'Collapse';
  b.setAttribute('aria-label',isCollapsed?'Expand exercise':'Collapse exercise');
}
function toggleCollapse(id) {
  const v=views.get(id); if(!v) return;
  const now=!v.el.classList.contains('collapsed');
  if(now) collapsed.add(id); else collapsed.delete(id);
  if(now&&v.el.contains(document.activeElement)) document.activeElement.blur();
  applyCollapsed(v.el,now);
  saveCollapsed();
}

function toggleLog(id) {
  const v=views.get(id); if(!v) return;
  const open=v.el.querySelector('.log-table-wrap').classList.toggle('visible');
  v.el.querySelector('.log-toggle').classList.toggle('open',open);
}

// ── Render ───────────────────────────────────────────────────────────────────
// Cards are keyed by id and patched in place, so a snapshot never rebuilds the
// grid: scroll position, open history tables and in-progress input survive.
const views=new Map();   // id → { el, sig, chart }
let cardsReady=false;

window.setCards = function(cards,ready) {
  window._cards=cards; cardsReady=ready;
  window.renderAll();
};

window.resetCards = function() {
  views.forEach(v=>v.chart&&v.chart.destroy());
  views.clear();
  window._cards=[]; cardsReady=false; pendingFocusId=null;
  const grid=document.getElementById('grid'); if(grid) grid.innerHTML='';
};

window.renderAll = function() {
  const grid=document.getElementById('grid'); if(!grid) return;
  const cards=window._cards||[];
  const ids=new Set(cards.map(c=>c.id));
  renderCleanup(cards);

  views.forEach((v,id)=>{ if(!ids.has(id)){ v.chart&&v.chart.destroy(); v.el.remove(); views.delete(id); } });

  let placeholder=grid.querySelector('.empty');
  if(!cards.length){
    if(!placeholder){ placeholder=document.createElement('div'); placeholder.className='empty'; grid.appendChild(placeholder); }
    placeholder.innerHTML=cardsReady
      ? `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" style="margin:0 auto 12px;display:block;opacity:.2"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#5c6380" stroke-width="1.5"/><path d="M12 8v8M8 12h8" stroke="#5c6380" stroke-width="1.5" stroke-linecap="round"/></svg><p>No exercises yet. Tap <strong style="color:#dde1f0">+ Add Exercise</strong> to begin.</p>`
      : `<p>Loading…</p>`;
    return;
  }
  placeholder?.remove();

  let prev=null;
  cards.forEach(c=>{
    let v=views.get(c.id);
    if(!v){
      v={el:buildCard(c),sig:null,chart:null}; views.set(c.id,v);
      if(c.id===pendingFocusId) collapsed.delete(c.id);
      applyCollapsed(v.el,collapsed.has(c.id));
    }
    const sig=JSON.stringify([c.name,c.unit,c.color,c.entries]);
    if(sig!==v.sig){ patchCard(v,c); v.sig=sig; }
    const want=prev?prev.nextSibling:grid.firstChild;
    if(v.el!==want) grid.insertBefore(v.el,want);
    prev=v.el;
  });

  if(pendingFocusId&&views.has(pendingFocusId)){
    const el=views.get(pendingFocusId).el; pendingFocusId=null;
    el.scrollIntoView({behavior:'smooth',block:'center'});
    const name=el.querySelector('.ex-name');
    name.focus({preventScroll:true}); name.select();
  }
};

// Static skeleton, built once per card. Dynamic parts are filled by patchCard.
function buildCard(c) {
  const div=document.createElement('div');
  div.className='card'; div.dataset.id=c.id;
  div.innerHTML=`
    <div class="card-line"></div>
    <div class="card-header">
      <div class="name-wrap">
        <input class="ex-name" placeholder="Exercise Name" aria-label="Exercise name" enterkeyhint="done">
      </div>
      <div class="card-btns">
        <button class="icon-btn collapse-btn" data-action="collapse" aria-expanded="true" title="Collapse" aria-label="Collapse exercise">
          <svg width="12" height="12" viewBox="0 0 11 11" fill="none"><path d="M1.5 7l4-4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" data-action="delete" title="Delete exercise" aria-label="Delete exercise">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 1l9 9M10 1l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="unit-row">
      <label>Unit</label>
      <input class="unit-input" placeholder="reps/miles/min" aria-label="Unit" enterkeyhint="done">
    </div>
    <div class="stat-bar">
      <div class="stat"><span class="stat-val s-count"></span><span class="stat-lbl">Days</span></div>
      <div class="sdiv"></div>
      <div class="stat"><span class="stat-val s-avg"></span><span class="stat-lbl">Avg / Day</span></div>
      <div class="sdiv"></div>
      <div class="stat"><span class="stat-val s-best"></span><span class="stat-lbl">Best Day</span></div>
    </div>
    <div class="entry-form">
      <div class="last-hint" hidden></div>
      <div class="field field-date"><label>Date</label><input type="date" class="in-date" value="${today()}"></div>
      <div class="field"><label class="amt-lbl"></label><input type="number" class="in-amt" placeholder="—" min="0" step="any" inputmode="decimal" enterkeyhint="done"></div>
      <div class="field"><label>Reps</label><input type="number" class="in-reps" placeholder="—" min="0" step="1" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"></div>
      <button class="log-btn" data-action="log">Log Set 1</button>
    </div>
    <div class="chart-wrap">
      <div class="chart-box"><canvas></canvas></div>
      <div class="no-data"><svg width="33" height="33" viewBox="0 0 24 24" fill="none"><polyline points="3,17 8,12 13,15 21,7" stroke="#5c6380" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Log 2+ days to see your chart</span></div>
    </div>
    <div class="log-section">
      <button class="log-toggle" data-action="toggle">
        <svg class="chev" width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 3.5l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="hist-lbl"></span>
      </button>
      <div class="log-table-wrap">
        <table class="log-table">
          <tbody></tbody>
        </table>
      </div>
    </div>`;
  return div;
}

function setInput(el,val) {
  // Never overwrite a field the user is currently editing.
  if(document.activeElement!==el && el.value!==val) el.value=val;
}

function patchCard(v,c) {
  const el=v.el, q=s=>el.querySelector(s);
  const a=analyze(c); v.analysis=a;
  const totals=a.days.map(d=>d.total);

  el.style.setProperty('--c',c.color||'#e8ff47');
  setInput(q('.ex-name'),c.name||'');
  setInput(q('.unit-input'),a.unit);
  // Stats use daily totals (same numbers as the chart).
  q('.stat-bar').title=a.days.length?`Daily totals in ${a.metric.label}`:'';
  q('.s-count').textContent=a.days.length;
  q('.s-avg').textContent=totals.length?fmtNum(totals.reduce((x,y)=>x+y,0)/totals.length,1):'—';
  q('.s-best').textContent=totals.length?fmtNum(Math.max(...totals)):'—';
  // Phones show just the unit ("LBS") so the label fits beside Reps.
  const showUnit=a.unit&&!isRepsUnit(a.unit);
  q('.amt-lbl').innerHTML=showUnit?`<span class="lbl-long">Amount (${esc(a.unit)})</span><span class="lbl-short">${esc(a.unit)}</span>`:'Amount';
  q('.amt-lbl').title=showUnit?`Amount (${a.unit})`:'';
  q('.hist-lbl').textContent=`History (${a.count})`;
  // History: newest day first, a header row with the day's total, then its sets.
  q('tbody').innerHTML=a.days.slice().reverse().map(d=>
    `<tr class="day"><td colspan="3"><span>${esc(fmtD(d.date))}</span><span class="day-total">${esc(fmtTotal(d.total,a.metric))}</span></td></tr>`+
    d.sets.map(s=>`<tr><td class="set-no">S${s.n}</td><td>${esc(setText(s,a.unit))}</td><td class="del" data-action="del-entry" data-eid="${esc(s.entry.id)}" title="Delete set">✕</td></tr>`).join('')
  ).join('');
  syncChart(v,c,a);
  updateHints(v);
}

// "Beat last time" hints for the date currently selected in the form.
function updateHints(v) {
  const a=v.analysis; if(!a) return;
  const el=v.el, q=s=>el.querySelector(s);
  const date=q('.in-date').value;
  const n=(a.days.find(d=>d.date===date)?.sets.length||0)+1;
  let last=null;
  if(date) for(const d of a.days){ if(d.date<date) last=d; else break; }
  const hint=q('.last-hint');
  if(last){
    hint.innerHTML=`Last session (${esc(fmtMD(last.date))}): <b>${esc(last.sets.map(setToken).join(' · '))}</b>`;
    hint.hidden=false;
  } else hint.hidden=true;
  const ls=last&&last.sets[n-1];
  q('.in-reps').placeholder=ls&&ls.reps!==null?`Last: ${ls.reps}`:'—';
  q('.in-amt').placeholder =ls&&ls.amt!==null ?`Last: ${fmtNum(ls.amt)}`:'—';
  q('.log-btn').textContent=`Log Set ${n}`;
}

// Chart: one point per day = that day's total (never one point per set).
function syncChart(v,c,a) {
  const noData=v.el.querySelector('.no-data');
  if(a.days.length<2){
    if(v.chart){v.chart.destroy();v.chart=null;}
    noData.hidden=false; return;
  }
  noData.hidden=true;
  const color=c.color||'#e8ff47';
  const labels=a.days.map(d=>fmtD(d.date)), data=a.days.map(d=>d.total);
  if(!v.chart){
    v.chart=new Chart(v.el.querySelector('canvas'),{
      type:'line',
      data:{labels,datasets:[{data,borderWidth:2.5,pointRadius:4,pointHoverRadius:6,tension:.35,fill:true}]},
      options:{
        // Chart.js resizes with its container (resize / orientation change).
        responsive:true,maintainAspectRatio:false,animation:{duration:340},
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#181c28',borderColor:'#252b3d',borderWidth:1,titleColor:'#8b93b0',bodyColor:'#dde1f0',
          callbacks:{label:ctx=>{
            const ch=ctx.chart, d=ch.$days[ctx.dataIndex], m=ch.$metric; if(!d) return '';
            const head=fmtTotal(d.total,m);
            return ' '+(d.sets.length>1?`${head} (${d.sets.map(setToken).join(m.sep)})`:head);
          }}}},
        scales:{
          x:{grid:{color:'rgba(37,43,61,.55)'},ticks:{color:'#8b93b0',font:{family:'DM Sans',size:10},maxRotation:30},border:{display:false}},
          y:{grid:{color:'rgba(37,43,61,.55)'},ticks:{color:'#8b93b0',font:{family:'DM Sans',size:10}},border:{display:false},
             title:{display:true,color:'#8b93b0',font:{family:'DM Sans',size:10}}}
        }
      }
    });
  } else {
    v.chart.data.labels=labels;
    v.chart.data.datasets[0].data=data;
  }
  const ds=v.chart.data.datasets[0];
  ds.borderColor=color; ds.pointBackgroundColor=color; ds.backgroundColor=hexRgba(color,.07);
  v.chart.options.scales.y.title.text=a.metric.label;
  v.chart.$days=a.days; v.chart.$metric=a.metric;
  v.chart.update();
}

// ── One-time cleanup of old bodyweight entries ──────────────────────────────
// Lists affected entries and changes nothing until the user confirms.
const cleanup={open:false,busy:false,dismissed:false,sig:''};

function legacyEntries(cards) {
  const rows=[];
  cards.forEach(c=>{ if(isRepsUnit(c.unit)) (c.entries||[]).forEach(e=>{ if(isLegacyRepsEntry(e)) rows.push({c,e}); }); });
  return rows.sort((x,y)=>(x.c.name||'').localeCompare(y.c.name||'')||String(x.e.date).localeCompare(String(y.e.date)));
}

function renderCleanup(cards) {
  const box=document.getElementById('cleanup'); if(!box) return;
  const rows=legacyEntries(cards);
  if(!rows.length||cleanup.dismissed){ box.hidden=true; box.innerHTML=''; cleanup.sig=''; cleanup.open=false; return; }
  const sig=JSON.stringify([rows.map(r=>[r.c.id,r.e.id,r.c.name]),cleanup.open,cleanup.busy]);
  if(sig===cleanup.sig) return;
  cleanup.sig=sig; box.hidden=false;
  const ex=new Set(rows.map(r=>r.c.id)).size;
  box.innerHTML=`<div><b>${rows.length} older ${rows.length===1?'entry':'entries'}</b> in ${ex} ${ex===1?'exercise':'exercises'} ${rows.length===1?'has':'have'} the rep count saved in Amount (from before the Reps field). They already display correctly; moving them to Reps keeps your data consistent.</div>`+
    (cleanup.open?`<div class="cleanup-list"><table><thead><tr><th>Exercise</th><th>Date</th><th>Amount</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td>${esc(r.c.name||'—')}</td><td>${esc(fmtD(r.e.date))}</td><td>${esc(fmtNum(r.e.amount))}</td></tr>`).join('')}</tbody></table></div>`:'')+
    `<div class="cleanup-btns">${cleanup.open
      ?`<button class="primary" data-cleanup="apply"${cleanup.busy?' disabled':''}>${cleanup.busy?'Updating…':`Move ${rows.length} to Reps`}</button><button data-cleanup="dismiss"${cleanup.busy?' disabled':''}>Not now</button>`
      :`<button class="primary" data-cleanup="review">Review list</button><button data-cleanup="dismiss">Not now</button>`}</div>`;
}

document.getElementById('cleanup').addEventListener('click',async e=>{
  const act=e.target.closest('[data-cleanup]')?.dataset.cleanup; if(!act||cleanup.busy) return;
  if(act==='review') cleanup.open=true;
  if(act==='dismiss') cleanup.dismissed=true;
  if(act==='apply'){
    const ids=[...new Set(legacyEntries(window._cards||[]).map(r=>r.c.id))];
    cleanup.busy=true; renderCleanup(window._cards||[]);
    const {moved,failed}=await window.LL.migrateLegacyReps(ids);
    cleanup.busy=false;
    if(!failed) showToast(`Moved ${moved} ${moved===1?'entry':'entries'} to Reps ✓`,'success');
  }
  renderCleanup(window._cards||[]);
});

// ── Events (delegated, so they survive in-place updates) ────────────────────
(function(){
  const grid=document.getElementById('grid');
  const idOf=el=>el.closest('.card')?.dataset.id;

  grid.addEventListener('click',e=>{
    const t=e.target.closest('[data-action]');
    if(!t){
      const h=e.target.closest('.card.collapsed .card-header');
      if(h&&!e.target.closest('input,button')) toggleCollapse(idOf(h));
      return;
    }
    const id=idOf(t); if(!id) return;
    switch(t.dataset.action){
      case 'collapse':  toggleCollapse(id); break;
      case 'delete':    deleteCard(id); break;
      case 'log':       logEntry(id); break;
      case 'toggle':    toggleLog(id); break;
      case 'del-entry': deleteEntry(id,t.dataset.eid); break;
    }
  });

  grid.addEventListener('focusout',e=>{
    const t=e.target, id=idOf(t); if(!id) return;
    if(t.classList.contains('ex-name'))    updateField(id,'name',t.value);
    if(t.classList.contains('unit-input')) updateField(id,'unit',t.value);
  });

  const onDate=e=>{
    if(!e.target.classList.contains('in-date')) return;
    const v=views.get(idOf(e.target)); if(v) updateHints(v);
  };
  grid.addEventListener('input',onDate);
  grid.addEventListener('change',onDate);

  grid.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const t=e.target, id=idOf(t); if(!id) return;
    if(t.classList.contains('in-amt')||t.classList.contains('in-reps')){ e.preventDefault(); logEntry(id); }
    else if(t.classList.contains('ex-name')||t.classList.contains('unit-input')) t.blur();
  });

  // Roll untouched date fields forward if the app stays open past midnight.
  let lastToday=today();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible') return;
    const t=today(); if(t===lastToday) return;
    document.querySelectorAll('.in-date').forEach(el=>{ if(el.value===lastToday&&document.activeElement!==el) el.value=t; });
    views.forEach(updateHints);
    lastToday=t;
  });
})();
</script>
